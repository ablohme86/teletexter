
# ====================
# Server Configuration 
# ====================
Port 5553

# How many can be connected at the same time
MaxClients 10
# =====================
# Message Configuration
# =====================

MaxMessageLength 120
MessageLogPath logs/messages/

# The layout file you want to use (how date, user, etc is ordered)
DisplayTextLayout layout.tel

# =====================
# User Configuration
# =====================
# Max length of nicknames (will return error if longer)
MaxNicknameLength 6
# All clients connecting must send IDENT followed by a nickname before sending MSG
# if MSG is sent without IDENT, nickname parameter will show as empty
MustIdentify YES
# If enabled all users who connect must also identify with a password (IDENT userName password)
EnablePassword YES
# Where all user info is stored
UserFilePath users/

# =====================
# Logging Configuration
# =====================

SystemLogPath = logs/


# =======================
# LCD Panel Configuration
# =======================

# The total of lines your display have
LCDColumns 2

# The total of characters 1 line can hold
LCDRows 16

# The address of your I2C LCD display
LCDAddress 0x27

# Filename of your i2c-device in /dev (Its usually i2c-1)
LCDDeviceFile /dev/i2c-1
